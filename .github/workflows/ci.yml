name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'src/')
      || contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'build.gradle')
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-backend-${{ hashFiles('build.gradle', 'settings.gradle') }}
          restore-keys: gradle-backend-

      - name: Build
        run: ./gradlew build -x test --no-daemon

  rag-pipeline:
    name: Rag-Pipeline Build
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'rag-pipeline/')
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rag-${{ hashFiles('rag-pipeline/build.gradle', 'rag-pipeline/settings.gradle') }}
          restore-keys: gradle-rag-

      - name: Build
        working-directory: rag-pipeline
        run: ./gradlew build -x test --no-daemon
