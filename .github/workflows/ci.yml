name: CI

on:
  push:
    branches: [ develop ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'rag-pipeline/src/**'
      - 'rag-pipeline/build.gradle'
      - 'rag-pipeline/settings.gradle'
  pull_request:
    branches: [ develop, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-backend-${{ hashFiles('build.gradle', 'settings.gradle') }}
          restore-keys: gradle-backend-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon

  rag-pipeline:
    name: Rag-Pipeline Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rag-${{ hashFiles('rag-pipeline/build.gradle', 'rag-pipeline/settings.gradle') }}
          restore-keys: gradle-rag-

      - name: Grant gradlew permission
        working-directory: rag-pipeline
        run: chmod +x gradlew

      - name: Build
        working-directory: rag-pipeline
        run: ./gradlew build -x test --no-daemon
