name: CI

on:
  push:
    branches: [ develop ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'rag-pipeline/src/**'
      - 'rag-pipeline/build.gradle'
      - 'rag-pipeline/settings.gradle'
  pull_request:
    branches: [ develop, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-backend-${{ hashFiles('build.gradle', 'settings.gradle') }}
          restore-keys: gradle-backend-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build
        # -x test 를 떼어 테스트까지 돌린다. 붙어 있던 동안 "Build pass"는
        # 컴파일이 됐다는 뜻일 뿐이었고, 테스트가 깨진 채로도 초록불이었다.
        run: ./gradlew build --no-daemon

      # 실패했을 때 어느 테스트가 왜 깨졌는지 로그만 보고 알기 어렵다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          retention-days: 7

  rag-pipeline:
    name: Rag-Pipeline Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rag-${{ hashFiles('rag-pipeline/build.gradle', 'rag-pipeline/settings.gradle') }}
          restore-keys: gradle-rag-

      - name: Grant gradlew permission
        working-directory: rag-pipeline
        run: chmod +x gradlew

      - name: Build
        working-directory: rag-pipeline
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rag-pipeline-test-report
          path: rag-pipeline/build/reports/tests/test
          retention-days: 7
