name: Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Image Tag
        run: echo "IMAGE_TAG=sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/timiroom-backend:${{ env.IMAGE_TAG }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Ops Repo with Kustomize
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/timiroom/timiroom-ops.git
          cd timiroom-ops/apps/backend
          
          kustomize edit set image backend-image=${{ secrets.DOCKER_USERNAME }}/timiroom-backend:${{ env.IMAGE_TAG }}
          
          rm -f secrets.env
          echo "$ALL_SECRETS_JSON" | jq -r 'to_entries[] | select(.key | startswith("APP_")) | "\(.key | sub("^APP_"; ""))=\(.value)"' > secrets.env
          
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "chore: kustomize deploy with dynamic secrets [${{ env.IMAGE_TAG }}]"
          git push
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}